name: ci

on:
  push:
    branches: [main, master, develop, 'feature/**', 'feat/**']
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    # 静态守门：能力归属 / 权限码映射 / 平台接入契约 / 兼容矩阵。
    # 纯源码与文档比对，不需要 JDK、Maven、Docker，秒级完成，故单列 job 最先给信号。
    #
    # 存在理由（2026-11-17 事故）：这四个脚本此前**没有任何自动执行入口**——不在本文件
    # 任一 job、不在 git hook、不在 npm script，红绿全靠人记得手跑；结果 PR #85 带着
    # capability-ownership 的 2 failed 合进 main（Workspace 渗透度计数漂移）。
    # 一个没人看的门禁等于没有门禁，故入 CI 成为绕不过的强制清点。
    #
    # 纪律：断言变更必须在提交信息写明理由，不得为图省事放宽阈值或加豁免名单。
    steps:
      - uses: actions/checkout@v4
        # 必须取 submodule：verify-capability-ownership.mjs 会 walk tioka-foundation 比对
        # 冻结类路径；未检出时它只打 WARN 并**跳过**这批断言，CI 守门会比本地弱（假绿）。
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          # 与 tioka-foundation 自身 CI 同版，避免两仓 node 版本漂移
          node-version: '22'
      - name: 能力归属清单与重复概念冻结
        run: node scripts/verify-capability-ownership.mjs
      - name: 权限码映射契约与双实现一致
        run: node scripts/verify-permission-code-mapping.mjs
      - name: 平台接入契约（平台定义 / 应用实例 / 实现三者一致）
        run: node tioka-foundation/scripts/verify-app-integration-contract.mjs
      - name: 兼容矩阵契约
        run: node tioka-foundation/scripts/verify-compatibility-matrix.mjs

  backend:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    steps:
      # Foundation 是 ADR-051 的独立仓库，经 submodule 钉版引入；根 pom 以
      # foundation-parent 为父（relativePath 为空，只从仓库解析），故必须先 install 到 m2。
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Foundation 自身的测试由其仓库 CI（build/gate/node-sdk/compatibility）覆盖，
      # 此处只产出构件供主仓库解析，不重复执行测试。
      - name: Install Foundation (submodule) into local m2
        working-directory: tioka-foundation
        run: mvn -B -q install -DskipTests
      - name: Verify (unit + IT)
        run: mvn -B verify

  gate:
    runs-on: ubuntu-latest
    # ENG-04c/04d：双实例 + Keycloak + RocketMQ + Mailpit；抬高堆与 Docker 可用内存
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Xmx3g
      MAVEN_OPTS: -Xmx1g
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Foundation (submodule) into local m2
        working-directory: tioka-foundation
        run: mvn -B -q install -DskipTests
      - name: Pre-pull Keycloak image
        run: docker pull quay.io/keycloak/keycloak:24.0
      - name: Pre-pull RocketMQ image
        run: docker pull apache/rocketmq:5.3.1
      - name: Pre-pull Mailpit image
        run: docker pull axllent/mailpit:v1.21.2
      - name: Gate (cluster + LLM/MCP/Feishu/OCR/SMTP + Keycloak + RocketMQ + Mailpit)
        run: mvn -B verify -Pgate
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tioka-ui
    steps:
      # 前端不需要 Foundation 构件，故不取 submodule，省去无谓 clone
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tioka-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
