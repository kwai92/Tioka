name: ci

on:
  push:
    branches: [main, master, develop, 'feature/**', 'feat/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify (unit + IT)
        run: mvn -B verify

  gate:
    runs-on: ubuntu-latest
    # ENG-04c/04d：双实例 + Keycloak + RocketMQ + Mailpit；抬高堆与 Docker 可用内存
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Xmx3g
      MAVEN_OPTS: -Xmx1g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pre-pull Keycloak image
        run: docker pull quay.io/keycloak/keycloak:24.0
      - name: Pre-pull RocketMQ image
        run: docker pull apache/rocketmq:5.3.1
      - name: Pre-pull Mailpit image
        run: docker pull axllent/mailpit:v1.21.2
      - name: Gate (cluster + LLM/MCP/Feishu/OCR/SMTP + Keycloak + RocketMQ + Mailpit)
        run: mvn -B verify -Pgate
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tioka-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tioka-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
