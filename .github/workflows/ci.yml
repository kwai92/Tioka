name: ci

on:
  push:
    branches: [main, master, develop, 'feature/**', 'feat/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    steps:
      # Foundation 是 ADR-051 的独立仓库，经 submodule 钉版引入；根 pom 以
      # foundation-parent 为父（relativePath 为空，只从仓库解析），故必须先 install 到 m2。
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Foundation 自身的测试由其仓库 CI（build/gate/node-sdk/compatibility）覆盖，
      # 此处只产出构件供主仓库解析，不重复执行测试。
      - name: Install Foundation (submodule) into local m2
        working-directory: tioka-foundation
        run: mvn -B -q install -DskipTests
      - name: Verify (unit + IT)
        run: mvn -B verify

  gate:
    runs-on: ubuntu-latest
    # ENG-04c/04d：双实例 + Keycloak + RocketMQ + Mailpit；抬高堆与 Docker 可用内存
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Xmx3g
      MAVEN_OPTS: -Xmx1g
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Foundation (submodule) into local m2
        working-directory: tioka-foundation
        run: mvn -B -q install -DskipTests
      - name: Pre-pull Keycloak image
        run: docker pull quay.io/keycloak/keycloak:24.0
      - name: Pre-pull RocketMQ image
        run: docker pull apache/rocketmq:5.3.1
      - name: Pre-pull Mailpit image
        run: docker pull axllent/mailpit:v1.21.2
      - name: Gate (cluster + LLM/MCP/Feishu/OCR/SMTP + Keycloak + RocketMQ + Mailpit)
        run: mvn -B verify -Pgate
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tioka-ui
    steps:
      # 前端不需要 Foundation 构件，故不取 submodule，省去无谓 clone
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tioka-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
