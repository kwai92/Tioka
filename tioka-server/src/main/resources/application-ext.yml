# 外置依赖 profile：docker compose -f deploy/compose.yml up -d
# 启动：SPRING_PROFILES_ACTIVE=ext mvn -pl tioka-server spring-boot:run
spring:
  config:
    activate:
      on-profile: ext
  datasource:
    url: jdbc:postgresql://${TIOKA_DB_HOST:localhost}:${TIOKA_DB_PORT:5432}/${TIOKA_DB_NAME:tioka}
    driver-class-name: org.postgresql.Driver
    username: ${TIOKA_DB_USER:tioka}
    password: ${TIOKA_DB_PASSWORD:tioka}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-pg.sql
  data:
    redis:
      host: ${TIOKA_REDIS_HOST:localhost}
      port: ${TIOKA_REDIS_PORT:6379}

tioka:
  env:
    name: ext
  auth:
    local-enabled: true
    oidc-enabled: ${TIOKA_OIDC_ENABLED:false}
    oidc-issuer: ${TIOKA_OIDC_ISSUER:mock://oidc}
    oidc-client-id: ${TIOKA_OIDC_CLIENT_ID:tioka}
    oidc-client-secret: ${TIOKA_OIDC_CLIENT_SECRET:}
    oidc-redirect-uri: ${TIOKA_OIDC_REDIRECT_URI:http://localhost:5173/login}
  model:
    mock: ${TIOKA_MODEL_MOCK:false}
  mcp:
    mock: ${TIOKA_MCP_MOCK:false}
  knowledge:
    vector-backend: pgvector
    embedding:
      base-url: ${TIOKA_EMBEDDING_BASE_URL:}
      api-key-ref: ${TIOKA_EMBEDDING_API_KEY_REF:}
      model: ${TIOKA_EMBEDDING_MODEL:text-embedding-3-small}
      dim: 32
  feishu:
    webhook-url: ${TIOKA_FEISHU_WEBHOOK:}
    app-id: ${TIOKA_FEISHU_APP_ID:}
    app-secret: ${TIOKA_FEISHU_APP_SECRET:}
    api-base: ${TIOKA_FEISHU_API_BASE:https://open.feishu.cn}
    receive-id-type: ${TIOKA_FEISHU_RECEIVE_ID_TYPE:chat_id}
