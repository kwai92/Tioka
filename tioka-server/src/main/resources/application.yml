server:
  port: 8080

spring:
  application:
    name: tioka-server
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${TIOKA_DB_HOST:localhost}:${TIOKA_DB_PORT:5432}/${TIOKA_DB_NAME:tioka}
    username: ${TIOKA_DB_USER:tioka}
    password: ${TIOKA_DB_PASSWORD:tioka}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # ADR-029 第 33 条修订：迁移随工作项合入，合入顺序可能与版本号不同
    out-of-order: true
    placeholders:
      embeddingDim: ${TIOKA_EMBEDDING_DIM:1024}
  data:
    redis:
      host: ${TIOKA_REDIS_HOST:localhost}
      port: ${TIOKA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: false

tioka:
  env:
    name: local
  home: ${TIOKA_HOME:${user.home}/.tioka}
  persistence:
    workspace-scoped-tables:
      - agent_agent
      - kb_base
      - flow_draft
      - mcp_server
      - skill_package
      - orch_run
      - chat_conversation
      - runtime_session
      - runtime_approval
  auth:
    local-enabled: true
    access-ttl: 8h
    refresh-ttl: 7d
    login-max-failures: 10
    cookie-secure: false
  bootstrap:
    admin-username: admin
  model:
    # local/slice 默认 mock；保真请叠加 profile=fidelity（见 application-fidelity.yml）
    mock: true
    failover-max: 2
  mcp:
    # local/slice 默认 mock；fidelity profile 关闭
    mock: true
  secret:
    # 优先环境变量 TIOKA_SECRET_MASTER_KEY；local 缺省用开发密钥并 WARN
    master-key: ${TIOKA_SECRET_MASTER_KEY:}
    require-external-key: false
  audit:
    sink: file
    retention-days: 365
    forward-batch-size: 100
    forward-delay-ms: 5000
    file-relative-path: audit/audit.jsonl
  knowledge:
    embedding-dim: ${TIOKA_EMBEDDING_DIM:1024}
    reindex-enabled: true
    reindex-interval-ms: 15000
    reindex-batch-size: 5
