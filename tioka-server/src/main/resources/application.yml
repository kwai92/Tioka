server:
  port: 8080

spring:
  application:
    name: tioka-server
  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

tioka:
  env:
    name: local
  auth:
    local-enabled: true
  model:
    # local/slice 默认 mock；保真请叠加 profile=fidelity（见 application-fidelity.yml）
    mock: true
  mcp:
    # local/slice 默认 mock；fidelity profile 关闭
    mock: true
  secret:
    # 优先环境变量 TIOKA_SECRET_MASTER_KEY；local 缺省用开发密钥并 WARN
    master-key: ${TIOKA_SECRET_MASTER_KEY:}
    require-external-key: false
