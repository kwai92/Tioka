# 本地开发：先 docker compose -f deploy/compose.yml up -d postgres redis
spring:
  datasource:
    url: jdbc:postgresql://${TIOKA_DB_HOST:localhost}:${TIOKA_DB_PORT:5432}/${TIOKA_DB_NAME:tioka}
    username: ${TIOKA_DB_USER:tioka}
    password: ${TIOKA_DB_PASSWORD:tioka}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${TIOKA_REDIS_HOST:localhost}
      port: ${TIOKA_REDIS_PORT:6379}

tioka:
  env:
    name: local
  model:
    mock: true
  mcp:
    mock: true
  secret:
    master-key: ${TIOKA_SECRET_MASTER_KEY:}
    require-external-key: false
  airgap:
    enabled: false
  feishu:
    app-id: ""
    app-secret: ""
    api-base: https://open.feishu.cn
    receive-id-type: chat_id
    webhook-url: ""
  auth:
    local-enabled: true
    oidc-enabled: false
  knowledge:
    vector-backend: local
    embedding:
      base-url: ""
      api-key-ref: ""
      model: text-embedding-3-small
      dim: 32

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
