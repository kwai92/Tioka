# 本地开发：先 docker compose -f deploy/compose.yml up -d postgres redis
spring:
  datasource:
    url: jdbc:postgresql://${TIOKA_DB_HOST:localhost}:${TIOKA_DB_PORT:5432}/${TIOKA_DB_NAME:tioka}?options=-c%20TimeZone%3DUTC
    username: ${TIOKA_DB_USER:tioka}
    password: ${TIOKA_DB_PASSWORD:tioka}
    driver-class-name: org.postgresql.Driver
  flyway:
    placeholders:
      embeddingDim: ${TIOKA_EMBEDDING_DIM:32}
  data:
    redis:
      host: ${TIOKA_REDIS_HOST:localhost}
      port: ${TIOKA_REDIS_PORT:6379}

tioka:
  env:
    name: local
  model:
    mock: true
  mcp:
    mock: true
  secret:
    master-key: ${TIOKA_SECRET_MASTER_KEY:}
    require-external-key: false
  airgap:
    enabled: false
  egress:
    mode: OPEN
    allow-hosts: []
    allow-private: true
    deny-cidrs: ["169.254.0.0/16", "100.100.100.200/32"]
  feishu:
    app-id: ""
    app-secret: ""
    api-base: https://open.feishu.cn
    receive-id-type: chat_id
    webhook-url: ""
  auth:
    local-enabled: true
    oidc:
      frontend-base-url: http://127.0.0.1:5173
      # 本地启用 Keycloak 时取消注释并设置 TIOKA_OIDC_SECRET
      # providers:
      #   keycloak:
      #     issuer-uri: http://localhost:8180/realms/tioka
      #     client-id: tioka
      #     client-secret: ${TIOKA_OIDC_SECRET:tioka-test-client-secret}
      #     groups-claim: groups
      #     auto-provision: true
      #     group-role-mappings:
      #       - { group: /tioka/admins, system-role: system_admin }
      #       - { group: /tioka/sales, workspace: ws_sales, role: member }
      # resource-server:
      #   enabled: true
      #   audiences: [tioka-api]
  knowledge:
    # 本地开发可用较小维度加速；生产默认 1024（见 application.yml）
    embedding-dim: ${TIOKA_EMBEDDING_DIM:32}
    reindex-enabled: true

# mybatis-plus 主配置见 application.yml（含 mapper-locations）
