spring:
  config:
    activate:
      on-profile: prod
tioka:
  model:
    mock: false
  airgap:
    enabled: false
  egress:
    mode: OPEN
    allow-hosts: []
    allow-private: true
    deny-cidrs: ["169.254.0.0/16", "100.100.100.200/32"]
  audit:
    sink: file
  secret:
    require-external-key: true
    master-key: ${TIOKA_SECRET_MASTER_KEY:}
