# llm-scripts/three-tools.yaml：需要 3 次工具调用的任务
# 末尾垫若干 content，供崩溃续跑 / 故障接力额外消耗，避免 script exhausted
calls:
  - tool_calls: [{ name: echo, arguments: { text: "step1" } }]
  - tool_calls: [{ name: echo, arguments: { text: "step2" } }]
  - tool_calls: [{ name: echo, arguments: { text: "step3" } }]
  - content: "done: step1 step2 step3"
    stream_chunk_chars: 4
    chunk_delay_ms: 50
  - content: "done: recovery pad 1"
  - content: "done: recovery pad 2"
  - content: "done: recovery pad 3"
  - content: "done: recovery pad 4"
  - content: "done: recovery pad 5"
  - content: "done: recovery pad 6"
