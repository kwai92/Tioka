# LSE-02/LSE-03 租赁领域包配置（java.util.Properties，隔离类加载器内 JDK 原生读取）。
# 由 LeasePackConfig 加载；业务确认后改配置不改代码（M3-04 §1 LSE-03）。

# ── V05 金额溯源：确定性金额正则 + 换算表 ─────────────────────
# 阿拉伯数字金额（含千分位与小数）
regex.amount=[0-9][0-9,]*(?:\\.[0-9]+)?
# 中文大写金额（数字位 + 单位）
regex.amountCn=[零壹贰叁肆伍陆柒捌玖拾佰仟万亿万元角分整]+
# 单位换算表（相对基准单位「元」的乘数）
convert.unit.\u5143=1
convert.unit.\u4e07\u5143=10000
# 期间换算表（相对基准期间「月」的月数；金额按 元/月 归一化 = 数值×单位乘数 ÷ 期间月数）
convert.period.\u6708=1
convert.period.\u5e74=12
convert.period.\u65e5=0.0333333333
# 面积单位（V04 引文须含其一）
regex.areaUnit=(?:\u33a1|\u5e73\u65b9\u7c73|\u5e73\u7c73|m2|M2|\u33a1)

# ── LSE-03 折叠引擎 [?] 业务问题（缺省「进复核」，业务确认后改配置）──
# N1：续约「其他条款不变」时递增是否继续
question.N1=REVIEW
# N2：终止时专项协议费用是否结束
question.N2=REVIEW
# N3：跨标的费用拆分口径
question.N3=REVIEW
# N4：空窗期租金是否顺延
question.N4=REVIEW
# N5：回购后押金利息归属
question.N5=REVIEW

# ── 折叠规则开关（R-1〜R-16；缺省全启用）────────────────────
rule.enabled=true
